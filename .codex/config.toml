model = "gpt-6-sol"
model_reasoning_effort = "medium"

[mcp_servers.UnityMCP]
url = "http://127.0.0.1:8080/mcp"

[agents]
enabled = true
max_concurrent_threads_per_session = 3

[agents.unity-reviewer]
description = "Unity C# 독립 읽기 전용 리뷰: 정확성, 성능, 직렬화 안전성."
config_file = "agents/unity-reviewer.toml"

[agents.unity-verifier]
description = "Unity 검증과 수정, 최대 3회 재검증."
config_file = "agents/unity-verifier.toml"

[agents.unity-module-worker]
description = "할당된 Unity 기능 모듈만 구현하고 통합 인계서를 작성하는 병렬 작업자."
config_file = "agents/unity-module-worker.toml"
